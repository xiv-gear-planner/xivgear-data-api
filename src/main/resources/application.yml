micronaut:
  application:
    name: xivgear-data-api
  server:
    cors:
      enabled: true
  openapi:
    enabled: true
  swagger:
    enabled: true
  swagger-ui:
    enabled: true
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

  object-storage:
    default-bucket: ${OBJECT_STORAGE_BUCKET_NAME:xivgear-data}
    local:
      default:
        enabled: true
        path: ${LOCAL_STORAGE_DIR:persistence}


xivapi:
  baseUri: https://bm.xivgear.app/api/1

data-manager:
  minIlvl: 290
  maxIlvl: 999
  minIlvlFood: 430
  maxIlvlFood: 999
  minIlvlBlu: 115
